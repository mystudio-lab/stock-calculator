<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>當沖進場試算</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--ink:#172033;--muted:#6b7280;--blue:#2563eb;--green:#16834b;--red:#c93636;--line:#e5e7eb;--yellow:#fff4c7;--peach:#fff0e8}
*{box-sizing:border-box} body{margin:0;font-family:system-ui,-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--ink)}
.wrap{max-width:760px;margin:auto;padding:18px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.title{font-size:24px;font-weight:800}.tabs{display:flex;background:#e9edf5;padding:4px;border-radius:12px}.tab{border:0;background:transparent;padding:9px 18px;border-radius:9px;font-weight:700;cursor:pointer}.tab.active{background:#fff;box-shadow:0 1px 5px #0002;color:var(--blue)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 3px 12px #1111}.card h2{font-size:16px;margin:0 0 12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}.field input{width:100%;font-size:20px;font-weight:700;padding:12px;border:1px solid #ccd2dc;border-radius:10px;background:#f9fafb}.result-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.result{padding:12px;border-radius:12px;background:#f7f9fc;border:1px solid var(--line)}.result small{display:block;color:var(--muted);margin-bottom:4px}.result strong{font-size:21px}.wide{grid-column:1/-1}.status{font-size:19px;font-weight:800;text-align:center;padding:13px;border-radius:12px}.ok{background:#e9f8ef;color:var(--green)}.bad{background:#fdecec;color:var(--red)}.warn{background:var(--yellow);color:#725b00}.actions{background:var(--peach)}.hint{font-size:13px;color:var(--muted);line-height:1.6}.checkrow{display:flex;gap:8px;align-items:center;margin:9px 0}.checkrow input{width:20px;height:20px}.footer{text-align:center;color:var(--muted);font-size:12px;margin:18px 0 8px}.symbol{width:100%;font-size:18px;padding:10px;border:1px solid #ccd2dc;border-radius:10px}
@media(max-width:560px){.wrap{padding:12px}.top{align-items:flex-start;flex-direction:column}.grid,.result-grid{grid-template-columns:1fr 1fr}.title{font-size:21px}}
</style>
</head><body><div class="wrap">
<div class="top"><div class="title">📈 當沖進場試算</div><div class="tabs"><button class="tab" id="longTab">做多</button><button class="tab active" id="shortTab">做空</button></div></div>
<div class="card"><h2>目前觀察標的</h2><input id="symbol" class="symbol" placeholder="例如：富喬"></div>
<div class="card"><h2>① 前日高低點（±7% 範圍）</h2><div class="grid"><div class="field"><label>前日低 A</label><input id="prevLow" type="number" step="0.1" inputmode="decimal" value="94.9"></div><div class="field"><label>前日高 B</label><input id="prevHigh" type="number" step="0.1" inputmode="decimal" value="105.5"></div></div><div class="result-grid" style="margin-top:12px"><div class="result"><small>前日高 +7%</small><strong id="plus7">—</strong></div><div class="result"><small>前日低 -7%</small><strong id="minus7">—</strong></div><div id="rangeStatus" class="status wide">—</div></div></div>
<div class="card"><h2 id="patternTitle">② M 型態高低點</h2><div class="grid"><div class="field"><label id="patternLowLabel">M 型態低點 C</label><input id="patternLow" type="number" step="0.1" inputmode="decimal" value="97.7"></div><div class="field"><label id="patternHighLabel">M 型態高點 D</label><input id="patternHigh" type="number" step="0.1" inputmode="decimal" value="98.8"></div></div></div>
<div class="card"><h2>③ 自動計算</h2><div class="result-grid"><div class="result"><small id="entryLabel">進場點 C − 2T</small><strong id="entry">—</strong></div><div class="result"><small id="stopLabel">停損點 D + 2T</small><strong id="stop">—</strong></div><div class="result"><small>停損差價金額 / 張</small><strong id="risk">—</strong></div><div class="result"><small>進場點 2.5% 金額</small><strong id="maxRisk">—</strong></div><div class="result wide"><small>進場條件公式</small><strong id="compareFormula">—</strong></div><div id="riskStatus" class="status wide">—</div></div></div>
<div class="card"><h2>④ / ⑤ 進場確認</h2><label class="checkrow"><input type="checkbox" id="confirm1" checked><span id="confirm1Text">站穩＋突破 M 高點（且在委賣第一檔）</span></label><label class="checkrow"><input type="checkbox" id="confirm2" checked><span id="confirm2Text">大單 -45 度下垂</span></label><div id="tradeStatus" class="status ok" style="margin-top:10px">條件確認完成</div></div>
<div class="card actions"><h2>⑥ 智慧單 MIT 設置</h2><div class="result-grid"><div class="result"><small>H. 停損點</small><strong id="mitStop">—</strong></div><div class="result"><small>I. 保本點</small><strong id="breakEven">—</strong></div><div class="result wide"><small id="mitTriggerLabel">獲利超過 I − 3T 才設定</small><strong id="mitTrigger">—</strong></div></div><p id="actionHint" class="hint"></p></div>
<div class="footer">計算依照你提供的 Excel 規則製作。T = 0.1，2T = 0.2；進場條件：進場點 2.5% 金額 < 停損差價金額。此工具僅做試算，不構成投資建議。</div>
</div>
<script>
let mode='short'; const $=id=>document.getElementById(id); const ids=['prevLow','prevHigh','patternLow','patternHigh'];
const n=id=>parseFloat($(id).value); const fmt=x=>Number.isFinite(x)?x.toLocaleString('zh-TW',{maximumFractionDigits:2}):'—';
function calc(){const A=n('prevLow'),B=n('prevHigh'),C=n('patternLow'),D=n('patternHigh'); $('plus7').textContent=fmt(B*1.07); $('minus7').textContent=fmt(A*.93); if(![A,B,C,D].every(Number.isFinite))return;
 let entry,stop,risk,maxRisk,be,trigger,rangeOK;
 if(mode==='short'){entry=C-.2; stop=D+.2; be=(entry*1000-entry*3)/1000; trigger=be-.3; rangeOK=entry<=B*1.07 && entry>=A*.93;}
 else{stop=C-.2; entry=D+.2; be=(entry*1000+entry*3)/1000; trigger=be+.4; rangeOK=entry<=B*1.07 && entry>=A*.93;}
 risk=Math.abs(stop-entry)*1000; maxRisk=entry*.025*1000;
 $('entry').textContent=fmt(entry);$('stop').textContent=fmt(stop);$('risk').textContent='$'+fmt(risk);$('maxRisk').textContent='$'+fmt(maxRisk);$('mitStop').textContent=fmt(stop);$('breakEven').textContent=fmt(be);$('mitTrigger').textContent=fmt(trigger);
 const pass=maxRisk<risk;
 $('compareFormula').innerHTML='2.5% 停損基準：$'+fmt(maxRisk)+'<br>本次停損金額：$'+fmt(risk);
 $('riskStatus').className='status wide '+(pass?'ok':'warn');
 $('riskStatus').textContent=pass?'✓ 2.5% 停損基準低於本次停損差價｜符合條件':'⚠ 2.5% 停損金額超過本次停損差價，謹慎評估是否入場';
 $('rangeStatus').className='status wide '+(rangeOK?'ok':'bad'); $('rangeStatus').textContent=rangeOK?'✓ 進場點位於前日 ±7% 範圍內':'✕ 進場點超出前日 ±7% 範圍，不做'; updateTrade(rangeOK,pass);
}
function updateTrade(){const checks=$('confirm1').checked&&$('confirm2').checked; $('tradeStatus').className='status '+(checks?'ok':'warn'); $('tradeStatus').textContent=checks?'✓ 進場確認完成':'尚有進場確認條件未勾選';}
function setMode(m){mode=m;$('longTab').classList.toggle('active',m==='long');$('shortTab').classList.toggle('active',m==='short'); if(m==='short'){$('patternTitle').textContent='② M 型態高低點';$('patternLowLabel').textContent='M 型態低點 C';$('patternHighLabel').textContent='M 型態高點 D';$('entryLabel').textContent='進場點 C − 2T';$('stopLabel').textContent='停損點 D + 2T';$('confirm1Text').textContent='跌破 M 低點（且在委賣第一檔）';$('confirm2Text').textContent='大單 -45 度下垂';$('mitTriggerLabel').textContent='獲利超過 I − 3T 才設定';$('actionHint').textContent='操作提示：先按賣才是放空；停損 / 保本 / 鎖利觸發後按買。';}else{$('patternTitle').textContent='② W 型態高低點';$('patternLowLabel').textContent='W 型態低點 C';$('patternHighLabel').textContent='W 型態高點 D';$('entryLabel').textContent='進場點 D + 2T';$('stopLabel').textContent='停損點 C − 2T';$('confirm1Text').textContent='站穩＋突破 W 高點（且在委買第一檔）';$('confirm2Text').textContent='大單 45 度上揚';$('mitTriggerLabel').textContent='獲利超過 I + 3T 才設定';$('actionHint').textContent='操作提示：進場按買；停損 / 保本 / 鎖利觸發後按賣。';} calc();}
ids.forEach(id=>$(id).addEventListener('input',calc));$('confirm1').addEventListener('change',()=>updateTrade());$('confirm2').addEventListener('change',()=>updateTrade());$('longTab').onclick=()=>setMode('long');$('shortTab').onclick=()=>setMode('short');setMode('short');
</script></body></html>
